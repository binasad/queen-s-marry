name: Merry Queens Website CI/CD

on:
  push:
    branches: [website]
    paths:
      - 'marry-queens-website/**'

jobs:
  deploy-to-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: marry-queens-website/package-lock.json

      - name: Create .env with backend URL
        run: echo "VITE_API_BASE_URL=${{ secrets.BACKEND_URL }}" > marry-queens-website/.env

      - name: Install dependencies
        run: cd marry-queens-website && npm ci

      - name: Build
        run: cd marry-queens-website && npm run build

      - name: Install Vercel CLI
        run: npm install --global vercel

      - name: Deploy to Vercel
        run: |
          cd marry-queens-website
          vercel deploy --prod --yes --token ${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.MARRY_QUEENS_WEBSITE_PROJECT_ID }}
